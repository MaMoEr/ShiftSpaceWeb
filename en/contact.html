<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — ShiftSpace</title>
  <meta name="description" content="Get in touch with ShiftSpace." />
  <link rel="alternate" hreflang="sv" href="https://www.shiftspace.se/contact.html" />
  <link rel="alternate" hreflang="en" href="https://www.shiftspace.se/en/contact.html" />
  <link rel="alternate" hreflang="x-default" href="https://www.shiftspace.se/contact.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/site.css" />
  <script>document.documentElement.classList.add('js');</script>
  <script src="../assets/nav.js" defer></script>
</head>
<body class="theme-dark">
  <div class="page">
    <header class="site-header">
      <a class="site-header__logo" href="index.html"><img src="../assets/lockup-amber.png" alt="ShiftSpace" width="450" height="71" /></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><svg class="nav-toggle__icon nav-toggle__icon--menu" viewBox="0 -960 960 960" width="28" height="28" aria-hidden="true" focusable="false"><path d="M140-254.62v-59.99h680v59.99H140ZM140-450v-60h680v60H140Zm0-195.39v-59.99h680v59.99H140Z"/></svg><svg class="nav-toggle__icon nav-toggle__icon--close" viewBox="0 -960 960 960" width="28" height="28" aria-hidden="true" focusable="false"><path d="M256-213.85 213.85-256l224-224-224-224L256-746.15l224 224 224-224L746.15-704l-224 224 224 224L704-213.85l-224-224-224 224Z"/></svg></button>
      <nav class="site-nav" id="site-nav" aria-label="Site navigation">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <a class="site-nav__lang" href="../contact.html" hreflang="sv" lang="sv" aria-label="Svenska">SV</a>
      </nav>
    </header>

    <main class="contact">
      <div class="contact__intro">
        <div class="kicker">Contact</div>
        <h1 class="display">Say hello.</h1>
        <p class="contact__lead">Tell us what you have in mind. We reply within two working days.</p>
      </div>

      <!--
        Submissions go to Formspree. Create a form at formspree.io and replace
        YOUR_FORM_ID in the action below with its ID.
      -->
      <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate
            data-err-name="Please add your name."
            data-err-email="Please add a valid email address."
            data-err-message="Please write a short message."
            data-err-send="Something went wrong. Please try again in a moment."
            data-thanks="Thank you, {name}. We&#39;ll be in touch.">
        <label class="field">
          <span class="field__label">Name</span>
          <input class="field__control" type="text" name="name" autocomplete="name" aria-describedby="err-name" />
          <span class="field__error" id="err-name" aria-live="polite"></span>
        </label>
        <label class="field">
          <span class="field__label">Email</span>
          <input class="field__control" type="email" name="email" autocomplete="email" aria-describedby="err-email" />
          <span class="field__error" id="err-email" aria-live="polite"></span>
        </label>
        <label class="field">
          <span class="field__label">Message</span>
          <textarea class="field__control" name="message" rows="6" aria-describedby="err-message"></textarea>
          <span class="field__error" id="err-message" aria-live="polite"></span>
        </label>
        <div class="hp" aria-hidden="true">
          <label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" /></label>
        </div>
        <div class="contact-form__actions">
          <p class="contact-form__status" id="form-status" role="alert"></p>
          <button class="btn btn--accent btn--lg" type="submit">Send →</button>
        </div>
      </form>

      <div class="contact-sent" id="contact-sent" hidden>
        <div class="contact-sent__label"><span class="contact-sent__dot"></span>Message sent</div>
        <p class="contact-sent__title" id="sent-title" tabindex="-1"></p>
        <div><button class="btn btn--outline-inverse" type="button" id="send-another">Send another</button></div>
      </div>
    </main>

    <footer class="site-footer">
      <span>ShiftSpace AB · Stockholm</span>
    </footer>
  </div>

  <script src="../assets/contact.js"></script>
</body>
</html>
