<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Planes — ShiftSpace</title>
  <meta name="description" content="A thousand paper planes, flocking. An interactive scene running in the browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-main:    #282E45;
      --color-accent:  #ECB200;
      --color-black:   #090D16;
      --color-white:   #EEF0F3;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--color-black);
      color: var(--color-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      padding: 20px 10vw;
      border-bottom: 1px solid rgba(238, 240, 243, 0.07);
      flex-shrink: 0;
    }

    .topbar__title {
      font-family: "Inter", sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--color-white);
      line-height: 1.1;
    }

    .topbar a {
      color: rgba(238, 240, 243, 0.5);
      font-size: 0.85rem;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      flex-shrink: 0;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .topbar a:hover {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
    }

    .topbar a:focus-visible {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    /* --- The flock fills everything under the header ------------------- */

    .stage {
      position: relative;
      flex: 1;
      /* Without this a flex child refuses to shrink below its content. */
      min-height: 0;
      /* Matches the scene's own background, so the loading state does not flash. */
      background: var(--color-black);
    }

    .stage__canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay used for loading, the click-to-load prompt and error states. */
    .stage__overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: var(--color-black);
      color: rgba(238, 240, 243, 0.45);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .stage__bar {
      width: min(240px, 60%);
      height: 2px;
      background: rgba(238, 240, 243, 0.12);
      overflow: hidden;
    }

    .stage__bar-fill {
      width: 0%;
      height: 100%;
      background: var(--color-accent);
      transition: width 120ms linear;
    }

    .stage__button {
      display: inline-block;
      background: rgba(236, 178, 0, 0.1);
      border: 1px solid rgba(236, 178, 0, 0.4);
      border-radius: 6px;
      padding: 10px 20px;
      color: var(--color-accent);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 120ms ease;
    }

    .stage__button:hover {
      background: rgba(236, 178, 0, 0.18);
    }

    .stage__button:focus-visible {
      background: rgba(236, 178, 0, 0.18);
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    .stage__note {
      font-size: 0.8rem;
      color: rgba(238, 240, 243, 0.3);
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 16px 6vw;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Paper Planes</h1>
    <a href="../index.html">← ShiftSpace</a>
  </header>

  <main class="stage" id="flock-box">
    <canvas
      class="stage__canvas"
      id="flock-canvas"
      role="img"
      aria-label="A thousand paper planes flocking in an open volume, parting around the mouse pointer."
    ></canvas>

    <div class="stage__overlay" id="flock-overlay">
      <p id="flock-message">Loading the flock…</p>
      <div class="stage__bar" id="flock-bar"><div class="stage__bar-fill" id="flock-bar-fill"></div></div>
      <button class="stage__button" id="flock-button" hidden type="button">Show the flock</button>
      <p class="stage__note" id="flock-note" hidden>About 11 MB</p>
    </div>
  </main>

  <script>
    (function () {
      var box      = document.getElementById("flock-box");
      var canvas   = document.getElementById("flock-canvas");
      var overlay  = document.getElementById("flock-overlay");
      var message  = document.getElementById("flock-message");
      var bar      = document.getElementById("flock-bar");
      var barFill  = document.getElementById("flock-bar-fill");
      var button   = document.getElementById("flock-button");
      var note     = document.getElementById("flock-note");

      // Unity's canvas swallows wheel events while hovered, which stalls the page. Capture
      // phase so this runs first; no preventDefault, so the browser still scrolls.
      box.addEventListener("wheel", function (e) { e.stopPropagation(); },
                           { capture: true, passive: true });

      function hasWebGL2() {
        try {
          return !!document.createElement("canvas").getContext("webgl2");
        } catch (e) {
          return false;
        }
      }

      function showPrompt(text, label) {
        message.textContent = text;
        bar.hidden = true;
        button.hidden = false;
        button.textContent = label;
        note.hidden = false;
      }

      function fail(text) {
        message.textContent = text;
        bar.hidden = true;
        button.hidden = true;
        note.hidden = true;
        canvas.hidden = true;
      }

      function load() {
        overlay.hidden = false;
        canvas.hidden = false;
        message.textContent = "Loading the flock…";
        bar.hidden = false;
        button.hidden = true;
        note.hidden = true;

        var script = document.createElement("script");
        script.src = "Build/Web.loader.js";
        script.onerror = function () { fail("The flock could not be loaded."); };
        script.onload = function () {
          createUnityInstance(canvas, {
            dataUrl:      "Build/Web.data.unityweb",
            frameworkUrl: "Build/Web.framework.js.unityweb",
            codeUrl:      "Build/Web.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName:    "ShiftSpace",
            productName:    "Planes",
            productVersion: "0.1.0",
            // Caps render resolution on retina screens for memory and GPU headroom. The
            // build is CPU-bound on the simulation, so this buys no frames.
            devicePixelRatio: Math.min(window.devicePixelRatio, 1.5)
          }, function (progress) {
            barFill.style.width = Math.round(progress * 100) + "%";
          }).then(function (instance) {
            // Keep it reachable — the control surface below is the only way to drive it.
            window.flock = instance;
            overlay.hidden = true;

            // The flock is stepped on the main thread and phones have less headroom than
            // the desktop this was measured on. 30 is hard to notice at this drift speed.
            instance.SendMessage("Flock", "SetTargetFrameRate", 30);

            // A canvas that has scrolled out of view keeps getting animation frames.
            if ("IntersectionObserver" in window) {
              new IntersectionObserver(function (entries) {
                instance.SendMessage("Flock", "SetPaused", entries[0].isIntersecting ? 0 : 1);
              }).observe(box);
            }
          }).catch(function () {
            fail("The flock could not be started in this browser.");
          });
        };
        document.body.appendChild(script);
      }

      button.addEventListener("click", load);

      var connection  = navigator.connection || {};
      var slow        = connection.saveData === true ||
                        /(^|\b)(slow-)?2g$/.test(connection.effectiveType || "");
      var reducedMotion = window.matchMedia &&
                          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!hasWebGL2()) {
        fail("This page needs WebGL2, which this browser does not support.");
      } else if (reducedMotion) {
        // Large, permanently moving animation — never start it unasked for a reader
        // who has asked for less motion.
        showPrompt("This is a continuously animated scene.", "Show the flock anyway");
      } else if (slow) {
        showPrompt("The flock is a large download.", "Show the flock");
      } else {
        load();
      }
    })();
  </script>
</body>
</html>
